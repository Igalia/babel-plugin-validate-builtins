name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "yarn"
      - name: Install
        run: yarn install --immutable
      - name: Check for duplicate dependencies
        run: yarn dedupe --check
      - name: Lint
        run: yarn lint
      - name: Check formatting
        run: yarn prettier --check .
      - name: TSCheck
        run: yarn tscheck

  test:
    name: Test on Node.js LTS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "yarn"
      - name: Install
        run: yarn install --immutable
      - name: Build
        run: yarn build
        env:
          BABEL_ENV: production
      - name: Test
        run: yarn jest --ci --color
